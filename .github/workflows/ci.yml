name: Gayatri Cloud CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend Lint & Tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linting
        run: ruff check app tests

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: testing
          DEBUG: "true"
          SECRET_KEY: test-ci-secret-key-min-32-chars-long
          PYTHONPATH: .
        run: pytest -v --cov=app --cov-report=term-missing tests/

  frontend-ci:
    name: Frontend Lint & Tests (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm install

      - name: Run Vitest Unit Tests
        run: npm test

  security-scan:
    name: Secrets & Repository Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Uncommitted Secrets & .env files
        run: |
          if [ -f .env ]; then
            echo "ERROR: Real .env file detected in repository root!"
            exit 1
          fi
          echo "Verified: No raw .env file present."
