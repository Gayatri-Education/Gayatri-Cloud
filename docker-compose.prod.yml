version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gayatri-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gayatri_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_strong_password_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-gayatri_cloud}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gayatri_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gayatri-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gayatri_admin}:${POSTGRES_PASSWORD:-postgres_strong_password_change_in_prod}@db:5432/${POSTGRES_DB:-gayatri_cloud}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-prod_jwt_secret_change_via_vault_or_ssm}
      SECRET_KEY: ${SECRET_KEY:-prod_encryption_secret_key_change_in_prod}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_ROOT: /app/storage
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://gayatri.internal,http://localhost}
    volumes:
      - backend_storage:/app/storage
    networks:
      - gayatri_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gayatri-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
    networks:
      - gayatri_internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1.5G

  reverse_proxy:
    image: nginx:1.25-alpine
    container_name: gayatri-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - gayatri_internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
    driver: local
  backend_storage:
    driver: local

networks:
  gayatri_internal:
    driver: bridge
